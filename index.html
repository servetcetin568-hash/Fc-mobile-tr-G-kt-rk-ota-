<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Göktürk Otağı</title>

<style>

/* LOADING */
#loader {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    color: #00ffd5;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    z-index: 999;
}

/* BODY */
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #000, #0f2027);
    color: white;
    text-align: center;
}

/* HEADER */
h1 {
    margin-top: 20px;
    color: #00ffd5;
    text-shadow: 0 0 20px #00ffd5;
}

/* LOGIN */
#loginBox {
    margin-top: 30px;
}

input {
    padding: 10px;
    margin: 5px;
    border: none;
    border-radius: 10px;
}

/* BUTTON (NEON) */
button {
    padding: 10px 20px;
    border-radius: 10px;
    background: black;
    color: #00ffd5;
    border: 1px solid #00ffd5;
    cursor: pointer;
    box-shadow: 0 0 10px #00ffd5;
    margin: 5px;
}

/* TEAM */
.team {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 30px;
}

.card {
    width: 200px;
    margin: 15px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.05);
    transition: 0.3s;
    border: 1px solid #00ffd5;
}

.card:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #00ffd5;
}

/* RANK */
.rank {
    color: gold;
    font-size: 14px;
}

/* SOCIAL */
.social a {
    margin: 10px;
    color: #00ffd5;
    text-decoration: none;
}

/* HIDE */
.hidden {
    display: none;
}

</style>
</head>

<body>

<div id="loader">Göktürk Otağı Yükleniyor...</div>

<h1>🐺 GÖKTÜRK OTAĞI</h1>
<p>Gücümüz birlikten ⚔️</p>

<!-- 🎵 MÜZİK BUTONU -->
<button onclick="playMusic()">🎵 Müziği Başlat</button>
<button onclick="pauseMusic()">⏸️ Durdur</button>

<!-- 🎵 AUDIO -->
<audio id="bgMusic" loop>
    <source src="muzik.mp3" type="audio/mpeg">
</audio>

<!-- LOGIN -->
<div id="loginBox">
    <input type="text" placeholder="Kullanıcı">
    <input type="password" placeholder="Şifre">
    <button onclick="login()">Giriş</button>
</div>

<!-- TEAM -->
<div id="teamArea" class="hidden">

<div class="team">

<div class="card">
<h3>Hector</h3>
<p class="rank">🔥 Legendary</p>
<p>⚽ Gol: 120</p>
<p>🎯 Asist: 45</p>
</div>

<div class="card">
<h3>AliEmreFC</h3>
<p class="rank">⚡ Elite</p>
<p>⚽ Gol: 98</p>
<p>🎯 Asist: 60</p>
</div>

<div class="card">
<h3>MehmetRamazanFC</h3>
<p class="rank">💀 Master</p>
<p>⚽ Gol: 110</p>
<p>🎯 Asist: 30</p>
</div>

<div class="card">
<h3>Nigtraider</h3>
<p class="rank">🌀 Pro</p>
<p>⚽ Gol: 85</p>
<p>🎯 Asist: 70</p>
</div>

</div>

<div class="social">
<a href="#">Discord</a>
<a href="#">Instagram</a>
</div>

</div>

<script>

/* LOADING */
setTimeout(() => {
    document.getElementById("loader").style.display = "none";
}, 2000);

/* LOGIN */
function login() {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("teamArea").classList.remove("hidden");
}

/* 🎵 MÜZİK */
function playMusic() {
    document.getElementById("bgMusic").play();
}

function pauseMusic() {
    document.getElementById("bgMusic").pause();
}

</script>

</body>
</html>
